name: Plugin checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  installer:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
        working-directory: useful-dsh-plugins
      - run: npm pack --dry-run --ignore-scripts
        working-directory: useful-dsh-plugins
  plugin:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        package: [dsh-plugin-doc-companion, dsh-plugin-vision-reader, dsh-plugin-voice-input, dsh-upload-button, useful-dsh-plugin-manager]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --legacy-peer-deps --ignore-scripts
      - run: npm install --legacy-peer-deps
        working-directory: ${{ matrix.package }}
      - run: npm run build
        working-directory: ${{ matrix.package }}
      - run: npm test
        working-directory: ${{ matrix.package }}
      - run: npm run check:release
